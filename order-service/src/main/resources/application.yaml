server:
  port: 8083

spring:
  application:
    name: order-service

  config:
    import: optional:nacos:order-service.yml

  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        server-addr: localhost:8848
      config:
        server-addr: localhost:8848
        file-extension: yml

    openfeign:
      circuitbreaker:
        enabled: true

    stream:
      rocketmq:
        binder:
          name-server: localhost:9876
      bindings:
        orderCreated-out-0:
          destination: order-created-topic
          content-type: application/json